<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Tontonan Kartun</title>
    <style>
        /* === SISTEM TEMA WARNA ASLI (DIKUNCI) === */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-card: #fafafa;
            --border-card: #ddd;
            --text-main: #333333;
            --text-muted: #666666;
        }

        .dark-mode {
            --bg-body: #0c111b; 
            --bg-container: #141a28;
            --bg-card: #1f273a;
            --border-card: #28334e;
            --text-main: #ffffff;
            --text-muted: #8f98b2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-top: 5px solid #00e5ff; 
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Tombol Kembali di Pojok Kiri Atas */
        .btn-kembali {
            background: #00e5ff;
            color: #141a28;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        h2 {
            color: #00e5ff; 
            margin: 0;
            text-transform: uppercase;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        /* === UKURAN & KOTAK VIDEO ASLI (MUTLAK TIDAK DIUBAH) === */
        .video-container {
            width: 100%;
            position: relative;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-card);
            display: none; 
        }

        .video-container iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        .close-video {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #ff0000;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            display: none;
        }

        /* Note Keterangan Tepat di Bawah Judul Video saat Diputar */
        .video-note {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
            margin-bottom: 15px;
            display: none;
            padding: 8px 12px;
            background: var(--bg-card);
            border-left: 3px solid #00e5ff;
            border-radius: 4px;
        }

        /* Gambar QRIS Donasi Tepat di Bawah Player Halaman Video */
        .donation-box {
            display: none;
            text-align: center;
            padding: 15px;
            margin-top: 25px;
            border-top: 1px dashed var(--border-card);
        }

        .donation-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .donation-qr {
            max-width: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* === LIST VIEW DAFTAR EPISODE ASLI === */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .episode-item {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text-main);
        }

        .episode-item:hover {
            border-color: #00e5ff;
        }

        /* Tempat Thumbnail Gambar di Samping Kiri Judul */
        .episode-thumbnail {
            width: 120px;
            height: 70px;
            background: #ccc;
            border-radius: 6px;
            margin-right: 15px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 3px solid #00e5ff;
        }

        .episode-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-info {
            flex: 1;
        }

        .episode-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .episode-badge {
            display: inline-block;
            background: #00e5ff;
            color: #141a28;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .pesan-kosong {
            text-align: center;
            padding: 30px;
            font-size: 16px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .video-container iframe {
                height: 220px;
            }
            .episode-thumbnail {
                width: 90px;
                height: 55px;
            }
            .episode-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-box">
            <div class="title-area">
                <a href="index.html" class="btn-kembali">← Kembali</a>
                <h2 id="namaKartun">Loading...</h2>
            </div>
            <button class="btn-theme" onclick="tukarTema()">Mod Gelap</button>
        </div>

        <div class="video-container" id="playerContainer">
            <button class="close-video" onclick="tutupVideo()">X</button>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
        
        <div class="video-title" id="judulTayangan"></div>

        <div class="video-note" id="noteTayangan">Note: Kalau mau layar penuh bisa landscape. Aktifkan mode putar otomatis atau rotasi otomatis layar HP.</div>
        
        <div class="donation-box" id="qrisDonasi">
            <div class="donation-title">Dukung Nonton Kartun via QRIS Donasi</div>
            <img src="https://via.placeholder.com/200x250?text=QRIS+DONASI" alt="QRIS Donasi" class="donation-qr">
        </div>

        <div class="list-container" id="senaraiEpisod"></div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const KEY_KARTUN = params.get('kartun') ? params.get('kartun').trim().toLowerCase() : "";

        const SHEET_KARTUN_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&single=true&output=csv";
        const SHEET_EPISODES_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=1868354275&single=true&output=csv";

        // Fungsi Pintar membaca baris CSV agar tidak pecah karena koma di dalam link/judul
        function parsingBarisCSV(teksBaris) {
            let hasil = [];
            let diDalamKutip = false;
            let nilaiKolom = "";
            
            for (let i = 0; i < teksBaris.length; i++) {
                let char = teksBaris[i];
                if (char === '"' || char === "'") {
                    diDalamKutip = !diDalamKutip;
                } else if (char === ',' && !diInsideKutip) {
                    hasil.push(nilaiKolom.trim());
                    nilaiKolom = "";
                } else {
                    nilaiKolom += char;
                }
            }
            hasil.push(nilaiKolom.trim());
            return hasil;
        }

        window.onload = function() {
            if(!KEY_KARTUN) {
                document.getElementById('namaKartun').innerText = "KARTUN TIDAK DITEMUI";
                document.getElementById('senaraiEpisod').innerHTML = "<div class='pesan-kosong'>Parameter rujukan tidak sah.</div>";
                return;
            }
            
            fetch(SHEET_KARTUN_URL)
            .then(res => res.text())
            .then(dataKartun => {
                let barisK = dataKartun.split(/\r?\n/);
                let namaKartunSebenar = "";
                
                for(let i=1; i<barisK.length; i++) {
                    if(barisK[i].trim() === "") continue;
                    let kol = parsingBarisCSV(barisK[i]);
                    if(kol.length >= 4 && kol[3].toLowerCase() === KEY_KARTUN) {
                        namaKartunSebenar = kol[0];
                        break;
                    }
                }
                
                if(namaKartunSebenar !== "") {
                    document.getElementById('namaKartun').innerText = namaKartunSebenar.toUpperCase();
                    muatTurunEpisodes();
                } else {
                    // Jika rujukan URL berbeda nama, kita paksa ambil teks judul dari parameter URL sebagai penyelamat
                    let namaFallback = KEY_KARTUN.replace(/-/g, " ");
                    document.getElementById('namaKartun').innerText = namaFallback.toUpperCase();
                    muatTurunEpisodes();
                }
            });
        };

        function muatTurunEpisodes() {
            fetch(SHEET_EPISODES_URL)
            .then(response => response.text())
            .then(data => {
                let baris = data.split(/\r?\n/);
                let senaraiBox = document.getElementById('senaraiEpisod');
                senaraiBox.innerHTML = "";
                let adaEpisod = false;

                for(let i = 1; i < baris.length; i++) {
                    if(baris[i].trim() === "") continue;

                    let kolom = parsingBarisCSV(baris[i]);
                    if(kolom.length < 4) continue;

                    let idKartun = kolom[0].toLowerCase();

                    // Pencocokan fleksibel agar boboiboy-s1 atau boboiboy-season-1 tetap lolos terbaca
                    if(idKartun === KEY_KARTUN || KEY_KARTUN.includes(idKartun) || idKartun.includes(KEY_KARTUN)) {
                        adaEpisod = true;
                        let epJudul = kolom[2];
                        let epLink = kolom[3];
                        let epThumb = kolom[4] ? kolom[4] : ""; 

                        let htmlItem = `
                            <div class="episode-item" onclick="mainkanVideo('${epLink}', '${epJudul}')">
                                <div class="episode-thumbnail">
                                    ${epThumb !== "" ? `<img src="${epThumb}" alt="${epJudul}">` : `<div style='color:var(--text-muted); font-size:11px;'>No Image</div>`}
                                </div>
                                <div class="episode-info">
                                    <p class="episode-title">${epJudul}</p>
                                    <span class="episode-badge">Episod</span>
                                </div>
                            </div>
                        `;
                        senaraiBox.innerHTML += htmlItem;
                    }
                }

                if(!adaEpisod) {
                    senaraiBox.innerHTML = "<div class='pesan-kosong'>Belum ada episod untuk kartun ini. Semak rujukan nama pautan pada Google Sheets.</div>";
                }
            });
        }

        function mainkanVideo(link, judul) {
            let playerContainer = document.getElementById('playerContainer');
            let videoPlayer = document.getElementById('videoPlayer');
            let judulTayangan = document.getElementById('judulTayangan');
            let noteTayangan = document.getElementById('noteTayangan');
            let qrisDonasi = document.getElementById('qrisDonasi');

            videoPlayer.src = link;
            playerContainer.style.display = "block";
            
            judulTayangan.innerText = judul;
            judulTayangan.style.display = "block";

            noteTayangan.style.display = "block";
            qrisDonasi.style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function tutupVideo() {
            let playerContainer = document.getElementById('playerContainer');
            let videoPlayer = document.getElementById('videoPlayer');
            let judulTayangan = document.getElementById('judulTayangan');
            let noteTayangan = document.getElementById('noteTayangan');
            let qrisDonasi = document.getElementById('qrisDonasi');

            videoPlayer.src = "";
            playerContainer.style.display = "none";
            judulTayangan.style.display = "none";
            noteTayangan.style.display = "none";
            qrisDonasi.style.display = "none";
        }

        function tukarTema() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
