<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Tontonan Kartun</title>
    <style>
        /* === SISTEM TEMA WARNA (DEFAULT: MOD TERANG) === */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-item: #fafafa;
            --border-item: #ddd;
            --text-main: #333333;
            --text-title: #ffffff;
        }

        /* Kelas untuk diaktifkan apabila Mod Gelap dipilih */
        .dark-mode {
            --bg-body: #1e1e24;
            --bg-container: #2a2a32;
            --bg-item: #33333d;
            --border-item: #444452;
            --text-main: #ffffff;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* UKURAN LIST VIEW DIPERLEBAR (DIPEPETIN KE SAMPING) */
        .container {
            max-width: 100%; 
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            padding: 15px; 
            border-top: 5px solid #00e5ff; 
            position: relative;
            transition: background-color 0.3s;
        }

        @media (min-width: 600px) {
            .container {
                max-width: 650px;
                padding: 20px;
            }
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
            min-height: 40px;
        }

        h2 {
            text-align: left;
            color: #00e5ff; 
            margin: 0;
            font-size: clamp(16px, 4.5vw, 24px);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-theme {
            background: var(--bg-item);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-theme:hover {
            background: #00e5ff;
            color: #1e1e24;
        }

        .list-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: var(--bg-item);
            border: 1px solid var(--border-item);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
        }

        .list-item:hover {
            background: var(--border-item);
            border-color: #00e5ff;
            transform: scale(1.01);
        }

        .list-item img {
            width: 150px; 
            height: 90px;  
            object-fit: cover;
            border-right: 3px solid #00e5ff;
            flex-shrink: 0;
        }

        .item-content {
            padding: 12px 15px;
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .episode-badge {
            display: inline-block;
            font-size: 11px;
            background-color: #00e5ff;
            color: #1e1e24;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        #halaman-nonton {
            display: none;
        }

        /* UKURAN VIDEO DAN KOTAK ASLI (DIKUNCI MATI 100%) */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 70%; 
            height: 0;
            border: 2px solid #00e5ff;
            border-radius: 8px;
            background-color: #000;
            margin-top: 0px; 
            margin-bottom: 10px;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin: 5px 0 0 0;
        }

        .video-note {
            font-size: 13px;
            color: #666666;
            margin-top: 8px;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: var(--bg-item);
            border-left: 3px solid #00e5ff;
            border-radius: 4px;
        }
        .dark-mode .video-note {
            color: #8f98b2;
        }

        .donation-box {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-top: 1px dashed var(--border-item);
        }

        .donation-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .donation-qr {
            max-width: 160px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-close {
            background: var(--bg-item);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-close:hover {
            background: #00e5ff;
            color: #1e1e24;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="halaman-senarai">
            <div class="header-box">
                <h2>
                    <button class="btn-close" onclick="history.back()">✕</button>
                    <span id="judul-halaman-list">LOADING...</span>
                </h2>
                <button class="btn-theme" id="temaBtn-list" onclick="tukarTema()">Mod Gelap</button>
            </div>
            
            <div class="list-view" id="boxSenaraiEpisode"></div>
        </div>

        <div id="halaman-nonton">
            <div class="header-box" style="margin-bottom: 15px;">
                <h2>
                    <button class="btn-close" onclick="kembaliKeSenarai()">✕</button>
                    <span id="judul-halaman-nonton">LOADING...</span>
                </h2>
                <button class="btn-theme" id="temaBtn-nonton" onclick="tukarTema()">Mod Gelap</button>
            </div>
            
            <div class="video-box">
                <iframe id="frame-video" src="" allowfullscreen></iframe>
            </div>
            <p class="video-title" id="tajuk-video"></p>

            <div class="video-note">Note: Kalau mau layar penuh bisa landscape. Aktifkan mode putar otomatis atau rotasi otomatis layar HP.</div>

            <div class="donation-box">
                <div class="donation-title">Dukung Nonton Kartun via QRIS Donasi</div>
                <img src="https://i.ibb.co.com/YBp6WJv3/qris.jpg" alt="QRIS Donasi" class="donation-qr">
            </div>
        </div>

    </div>

    <script>
        const URL_CSV_EPISODES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=1389944860&single=true&output=csv";
        const URL_CSV_KARTUN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&output=csv";

        const urlParams = new URLSearchParams(window.location.search);
        const kartunID = urlParams.get('kartun') ? urlParams.get('kartun').trim().toLowerCase() : "";

        window.onload = function() {
            if(!kartunID) {
                document.getElementById('judul-halaman-list').innerText = "KARTUN TIDAK DITEMUI";
                return;
            }

            fetch(URL_CSV_KARTUN)
            .then(res => res.text())
            .then(kartunData => {
                let barisKartun = kartunData.replace(/\r/g, "").split("\n");
                let judulDitemukan = "";
                
                for(let i = 1; i < barisKartun.length; i++) {
                    if(barisKartun[i].trim() === "") continue;
                    let kol = barisKartun[i].split(",");
                    if(kol.length >= 4) {
                        let linkKartunSheet = kol[3].replace(/^"|"$/g, '').trim().toLowerCase();
                        if(linkKartunSheet === kartunID) {
                            judulDitemukan = kol[0].replace(/^"|"$/g, '').trim();
                            break;
                        }
                    }
                }

                if(judulDitemukan !== "") {
                    document.getElementById('judul-halaman-list').innerText = judulDitemukan;
                    document.getElementById('judul-halaman-nonton').innerText = judulDitemukan;
                } else {
                    let kata = kartunID.split('-');
                    for (let i = 0; i < kata.length; i++) {
                        if (kata[i] === 's1' || kata[i] === 's2' || kata[i] === 's3') {
                            kata[i] = "SEASON " + kata[i].substring(1);
                        } else if (kata[i] === 'm1' || kata[i] === 'm2') {
                            kata[i] = "MUSIM " + kata[i].substring(1);
                        } else {
                            kata[i] = kata[i].charAt(0).toUpperCase() + kata[i].slice(1);
                        }
                    }
                    let namaFormatAsli = kata.join(' ');
                    document.getElementById('judul-halaman-list').innerText = namaFormatAsli;
                    document.getElementById('judul-halaman-nonton').innerText = namaFormatAsli;
                }
            })
            .catch(() => {
                document.getElementById('judul-halaman-list').innerText = kartunID.toUpperCase();
                document.getElementById('judul-halaman-nonton').innerText = kartunID.toUpperCase();
            });

            fetch(URL_CSV_EPISODES)
            .then(response => response.text())
            .then(data => {
                saringDanPaparkanEpisode(data);
            })
            .catch(err => {
                console.error("Gagal memuat data episode: ", err);
                document.getElementById('boxSenaraiEpisode').innerHTML = "<p style='text-align:center;'>Gagal memuatkan episod.</p>";
            });
        };

        // Fungsi Parser CSV Khusus agar tanda koma di dalam Judul tidak mengacaukan pembacaan Kolom E (Indeks 4)
        function pecahBarisCSV(teksBaris) {
            let hasil = [];
            let dalamKutipan = false;
            let isiKolom = "";
            
            for (let i = 0; i < teksBaris.length; i++) {
                let karakter = teksBaris[i];
                if (karakter === '"') {
                    dalamKutipan = !dalamKutipan;
                } else if (karakter === ',' && !dalamKutipan) {
                    hasil.push(isiKolom);
                    isiKolom = "";
                } else {
                    isiKolom += karakter;
                }
            }
            hasil.push(isiKolom);
            return hasil;
        }

        function saringDanPaparkanEpisode(text) {
            let baris = text.split("\n");
            let listContainer = document.getElementById('boxSenaraiEpisode');
            listContainer.innerHTML = ""; 

            let adaEpisode = false;

            for(let i = 1; i < baris.length; i++) {
                if(baris[i].trim() === "") continue;

                // Menggunakan fungsi pemisah berbasis pengaman kutipan koma
                let kolom = pecahBarisCSV(baris[i]);
                if(!kolom || kolom.length < 4) continue;

                let idKartunTab = kolom[0].replace(/^"|"$/g, '').trim().toLowerCase();
                let noEpisode = kolom[1].replace(/^"|"$/g, '').trim();
                let judulEpisode = kolom[2].replace(/^"|"$/g, '').trim();
                let linkVideo = kolom[3].replace(/^"|"$/g, '').trim();
                
                // KOLOM E ADALAH INDEKS KE-4 (Kolom ke-5 di Google Sheet)
                let linkThumbnailSheet = kolom[4] ? kolom[4].replace(/\r/g, "").replace(/^"|"$/g, '').trim() : "";

                if(idKartunTab === kartunID) {
                    adaEpisode = true;
                    let gambarThumbnail = "";

                    // JIKA KOLOM E BERISI LINK GAMBAR (BEBAS), MAKA LANGSUNG PAKAI LINK TERSEBUT
                    if (linkThumbnailSheet !== "" && linkThumbnailSheet.toLowerCase() !== "undefined") {
                        gambarThumbnail = linkThumbnailSheet;
                    } else {
                        // Fallback otomatis jika kolom E dikosongkan
                        if (!linkVideo.includes('drive.google.com') && linkVideo !== "") {
                            gambarThumbnail = `https://img.youtube.com/vi/${linkVideo}/0.jpg`;
                        } else {
                            gambarThumbnail = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIThhOGE4YSI+PHBhdGggZD0iTTAgMGg0OHY0OEgweiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0yMSAzaC0xOGMtMS4xIDAtMiAuOS0yIDh2MTJjMCAxLjEuOSAyIDIgMmgxOGMxLjEgMCAyLS45IDItMlY1YzAtMS4xLS45LTItMi0yeG0tOSA0YzEuNjYgMCAzIDEuMzQgMyAzcy0xLjM0IDMtMyAzLTMtMS4zNC0zLTMgMS4zNC0zIDMtM3ptNiAxMmgtMTJ2LTEuNmMwLTIgNC0zLjEgNi0zLjFzNiAxLjEgNiAzLjFWMTd6Ii8+PC9zdmc+";
                        }
                    }

                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    
                    itemDiv.onclick = function() {
                        bukaVideo(linkVideo, `Episod ${noEpisode}: ${judulEpisode}`);
                    };

                    itemDiv.innerHTML = `
                        <img src="${gambarThumbnail}" alt="Thumbnail">
                        <div class="item-content">
                            <p class="item-title">Episod ${noEpisode}: ${judulEpisode}</p>
                            <span class="episode-badge">Episod ${noEpisode}</span>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                }
            }

            if(!adaEpisode) {
                listContainer.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Belum ada episod untuk kartun ini.</p>";
            }
        }

        function bukaVideo(linkVideo, tajukVideo) {
            document.getElementById('halaman-senarai').style.display = 'none';
            document.getElementById('halaman-nonton').style.display = 'block';
            
            let frameVideo = document.getElementById('frame-video');
            let linkBersih = linkVideo.trim();
            
            if (linkBersih.includes('drive.google.com')) {
                let match = linkBersih.match(/\/file\/d\/([^\/]+)/);
                if (match && match[1]) {
                    frameVideo.src = "https://drive.google.com/file/d/" + match[1] + "/preview";
                } else {
                    frameVideo.src = linkBersih;
                }
            } else if (linkBersih.startsWith('http://') || linkBersih.startsWith('https://')) {
                frameVideo.src = linkBersih;
            } else {
                frameVideo.src = "https://www.youtube.com/embed/" + linkBersih + "?autoplay=1";
            }
            
            document.getElementById('tajuk-video').innerText = tajukVideo;
        }

        function kembaliKeSenarai() {
            document.getElementById('halaman-senarai').style.display = 'block';
            document.getElementById('halaman-nonton').style.display = 'none';
            document.getElementById('frame-video').src = "";
        }

        function tukarTema() {
            var body = document.body;
            var btnList = document.getElementById('temaBtn-list');
            var btnNonton = document.getElementById('temaBtn-nonton');
            
            body.classList.toggle('dark-mode');
            
            let teksTema = body.classList.contains('dark-mode') ? "Mod Terang" : "Mod Gelap";
            if(btnList) btnList.innerText = teksTema;
            if(btnNonton) btnNonton.innerText = teksTema;
        }
    </script>
</body>
</html>
