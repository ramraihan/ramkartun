<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Tontonan Kartun</title>
    <style>
        /* === SISTEM TEMA WARNA === */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-card: #fafafa;
            --border-card: #ddd;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-search: #ffffff;
        }

        .dark-mode {
            --bg-body: #0c111b; 
            --bg-container: #141a28;
            --bg-card: #1f273a;
            --border-card: #28334e;
            --text-main: #ffffff;
            --text-muted: #8f98b2;
            --bg-search: #1f273a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-top: 5px solid #00e5ff; 
            position: relative;
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        h2 {
            color: #00e5ff; 
            margin: 0;
            text-transform: uppercase;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Ruang Video (Ukuran asli tidak diubah sama sekali) */
        .video-container {
            width: 100%;
            position: relative;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-card);
            display: none; 
        }

        .video-container iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        .close-video {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #ff0000;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            display: none;
        }

        /* Teks Note Keterangan permanen di bawah judul video sesuai request kamu */
        .video-note {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: none;
            padding: 8px 12px;
            background: var(--bg-card);
            border-left: 3px solid #00e5ff;
            border-radius: 4px;
        }

        /* List View (Daftar Episode) */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .episode-item {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text-main);
        }

        .episode-item:hover {
            border-color: #00e5ff;
        }

        /* Bagian Thumbnail List View */
        .episode-thumbnail {
            width: 120px;
            height: 70px;
            background: #ccc;
            border-radius: 6px;
            margin-right: 15px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 3px solid #00e5ff;
        }

        .episode-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-info {
            flex: 1;
        }

        .episode-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .episode-badge {
            display: inline-block;
            background: #00e5ff;
            color: #141a28;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .pesan-kosong {
            text-align: center;
            padding: 30px;
            font-size: 16px;
            color: var(--text-muted);
        }

        /* Area Donasi QRIS di bagian bawah agak jauh */
        .donation-container {
            margin-top: 60px; 
            text-align: center;
            padding: 20px;
            border-top: 1px dashed var(--border-card);
        }

        .donation-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .donation-qr {
            max-width: 200px; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .video-container iframe {
                height: 220px;
            }
            .episode-thumbnail {
                width: 90px;
                height: 55px;
            }
            .episode-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-box">
            <h2 id="namaKartun">Loading...</h2>
            <button class="btn-theme" onclick="tukarTema()">Mod Gelap</button>
        </div>

        <div class="video-container" id="playerContainer">
            <button class="close-video" onclick="tutupVideo()">X</button>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
        
        <div class="video-title" id="judulTayangan"></div>

        <div class="video-note" id="noteTayangan">Note: Kalau mau layar penuh bisa landscape. Aktifkan mode putar otomatis atau rotasi otomatis layar HP.</div>
        
        <div class="list-container" id="senaraiEpisod"></div>

        <div class="donation-container">
            <div class="donation-title">Dukung Nonton Kartun via QRIS Donasi</div>
            <img src="https://via.placeholder.com/200x250?text=QRIS+DONASI" alt="QRIS Donasi" class="donation-qr">
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const KEY_KARTUN = params.get('kartun');

        // URL Google Sheets (Gid=0)
        const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&single=true&output=csv";

        window.onload = function() {
            if(!KEY_KARTUN) {
                document.getElementById('namaKartun').innerText = "KARTUN TIDAK DITEMUI";
                document.getElementById('senaraiEpisod').innerHTML = "<div class='pesan-kosong'>Parameter rujukan tidak sah.</div>";
                return;
            }
            
            fetch(URL_CSV)
            .then(response => response.text())
            .then(data => {
                prosesDataEpisode(data);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('namaKartun').innerText = "RALAT DATA";
            });
        };

        function prosesDataEpisode(text) {
            let baris = text.split("\n");
            let senaraiBox = document.getElementById('senaraiEpisod');
            senaraiBox.innerHTML = "";

            let jumpaKartun = false;
            let namaKartunSebenar = "";
            let adaEpisod = false;

            for(let i = 1; i < baris.length; i++) {
                if(baris[i].trim() === "") continue;

                let kolom = baris[i].split(",");
                if(kolom.length < 4) continue;

                let judulUtama = kolom[0].trim();
                let linkRujukan = kolom[3].trim();

                if(linkRujukan === KEY_KARTUN) {
                    jumpaKartun = true;
                    namaKartunSebenar = judulUtama;

                    if(kolom.length > 4 && kolom[4].trim() !== "") {
                        adaEpisod = true;
                        
                        let epJudul = kolom[4].trim();
                        let epLink = kolom[5] ? kolom[5].trim() : "";
                        let epThumb = kolom[6] ? kolom[6].trim() : "";

                        let htmlItem = `
                            <div class="episode-item" onclick="mainkanVideo('${epLink}', '${epJudul}')">
                                <div class="episode-thumbnail">
                                    ${epThumb !== "" ? `<img src="${epThumb}" alt="${epJudul}">` : `<div style="color:var(--text-muted); font-size:11px;">No Image</div>`}
                                </div>
                                <div class="episode-info">
                                    <p class="episode-title">${epJudul}</p>
                                    <span class="episode-badge">Episod</span>
                                </div>
                            </div>
                        `;
                        senaraiBox.innerHTML += htmlItem;
                    }
                }
            }

            if(!jumpaKartun) {
                document.getElementById('namaKartun').innerText = "KARTUN TIDAK DITEMUI";
                senaraiBox.innerHTML = "<div class='pesan-kosong'>Maaf, rekod kartun ini tidak wujud.</div>";
            } else {
                document.getElementById('namaKartun').innerText = namaKartunSebenar.toUpperCase();
                if(!adaEpisod) {
                    senaraiBox.innerHTML = "<div class='pesan-kosong'>Belum ada episod untuk kartun ini.</div>";
                }
            }
        }

        function mainkanVideo(link, judul) {
            let playerContainer = document.getElementById('playerContainer');
            let videoPlayer = document.getElementById('videoPlayer');
            let judulTayangan = document.getElementById('judulTayangan');
            let noteTayangan = document.getElementById('noteTayangan');

            videoPlayer.src = link;
            playerContainer.style.display = "block";
            
            judulTayangan.innerText = judul;
            judulTayangan.style.display = "block";

            // Langsung memunculkan Note Keterangan permanen
            noteTayangan.style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function tutupVideo() {
            let playerContainer = document.getElementById('playerContainer');
            let videoPlayer = document.getElementById('videoPlayer');
            let judulTayangan = document.getElementById('judulTayangan');
            let noteTayangan = document.getElementById('noteTayangan');

            videoPlayer.src = "";
            playerContainer.style.display = "none";
            judulTayangan.style.display = "none";
            noteTayangan.style.display = "none";
        }

        function tukarTema() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
