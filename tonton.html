<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Tontonan Kartun</title>
    <style>
        /* === SISTEM TEMA WARNA (DEFAULT: MOD TERANG) === */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-item: #fafafa;
            --border-item: #ddd;
            --text-main: #333333;
            --text-title: #ffffff;
        }

        .dark-mode {
            --bg-body: #1e1e24;
            --bg-container: #2a2a32;
            --bg-item: #33333d;
            --border-item: #444452;
            --text-main: #ffffff;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px; 
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 100%; 
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            padding: 15px; 
            border-top: 5px solid #00e5ff; 
            position: relative;
            transition: background-color 0.3s;
        }

        @media (min-width: 600px) {
            .container {
                max-width: 650px;
                padding: 20px;
            }
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
            min-height: 40px;
        }

        h2 {
            text-align: left;
            color: #00e5ff; 
            margin: 0;
            font-size: clamp(16px, 4.5vw, 24px);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-theme {
            background: var(--bg-item);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-theme:hover {
            background: #00e5ff;
            color: #1e1e24;
        }

        .list-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: var(--bg-item);
            border: 1px solid var(--border-item);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
        }

        .list-item:hover {
            background: var(--border-item);
            border-color: #00e5ff;
            transform: scale(1.01);
        }

        .list-item img {
            width: 150px; 
            height: 90px;  
            object-fit: cover;
            border-right: 3px solid #00e5ff;
            flex-shrink: 0;
        }

        .item-content {
            padding: 12px 15px;
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .episode-badge {
            display: inline-block;
            font-size: 11px;
            background-color: #00e5ff;
            color: #1e1e24;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        #halaman-nonton {
            display: none;
        }

        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 70%; 
            height: 0;
            border: 2px solid #00e5ff;
            border-radius: 8px;
            background-color: #000;
            margin-top: 0px; 
            margin-bottom: 10px;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin: 5px 0 0 0;
        }

        .video-note {
            font-size: 13px;
            color: #666666;
            margin-top: 8px;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: var(--bg-item);
            border-left: 3px solid #00e5ff;
            border-radius: 4px;
        }
        .dark-mode .video-note {
            color: #8f98b2;
        }

        .donation-box {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-top: 1px dashed var(--border-item);
        }

        .donation-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .donation-qr {
            max-width: 160px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-close {
            background: var(--bg-item);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-close:hover {
            background: #00e5ff;
            color: #1e1e24;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="halaman-senarai">
            <div class="header-box">
                <h2>
                    <button class="btn-close" onclick="history.back()">✕</button>
                    <span id="judul-halaman-list">LOADING...</span>
                </h2>
                <button class="btn-theme" id="temaBtn-list" onclick="tukarTema()">Mod Gelap</button>
            </div>
            
            <img id="banner-kartun" src="" alt="Banner" style="width:100%; height:auto; margin-bottom:15px; border-radius:8px; display:none; border: 2px solid #00e5ff;">
            
            <div class="list-view" id="boxSenaraiEpisode"></div>
        </div>

        <div id="halaman-nonton">
            <div class="header-box" style="margin-bottom: 15px;">
                <h2>
                    <button class="btn-close" onclick="kembaliKeSenarai()">✕</button>
                    <span id="judul-halaman-nonton">LOADING...</span>
                </h2>
                <button class="btn-theme" id="temaBtn-nonton" onclick="tukarTema()">Mod Gelap</button>
            </div>
            
            <div class="video-box">
                <iframe id="frame-video" src="" allowfullscreen></iframe>
            </div>
            <p class="video-title" id="tajuk-video"></p>

            <div class="video-note">Note: Kalau mau layar penuh bisa landscape. Aktifkan mode putar otomatis atau rotasi otomatis layar HP.</div>

            <div class="donation-box">
                <div class="donation-title">Dukung Nonton Kartun via QRIS Donasi</div>
                <img src="https://i.ibb.co.com/YBp6WJv3/qris.jpg" alt="QRIS Donasi" class="donation-qr">
            </div>
        </div>
    </div>

    <script>
        const URL_CSV_EPISODES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=1389944860&single=true&output=csv";
        const URL_CSV_KARTUN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&output=csv";

        const urlParams = new URLSearchParams(window.location.search);
        const kartunID = urlParams.get('kartun') ? urlParams.get('kartun').trim().toLowerCase() : "";

        function parseBarisCSVAman(text) {
            let p = RegExp('[^",\\r\\n]+|\"(?:[^"\\\\]|\\\\.)*\"|(?<=,)(?=,)|^(?=,)|(?<=,)$', 'g');
            return text.match(p) || [];
        }

        window.onload = function() {
            if(!kartunID) { document.getElementById('judul-halaman-list').innerText = "KARTUN TIDAK DITEMUI"; return; }

            fetch(URL_CSV_KARTUN)
            .then(res => res.text())
            .then(kartunData => {
                let baris = kartunData.replace(/\r/g, "").split("\n");
                for(let i = 1; i < baris.length; i++) {
                    let kol = parseBarisCSVAman(baris[i]);
                    if(kol.length >= 4 && kol[3].replace(/^"|"$/g, '').trim().toLowerCase() === kartunID) {
                        let judul = kol[0].replace(/^"|"$/g, '').trim();
                        let linkBanner = kol[4] ? kol[4].replace(/^"|"$/g, '').trim() : "";
                        document.getElementById('judul-halaman-list').innerText = judul;
                        document.getElementById('judul-halaman-nonton').innerText = judul;
                        let banner = document.getElementById('banner-kartun');
                        if(linkBanner !== "") { banner.src = linkBanner; banner.style.display = "block"; }
                        break;
                    }
                }
            });

            fetch(URL_CSV_EPISODES)
            .then(res => res.text())
            .then(data => saringDanPaparkanEpisode(data))
            .catch(err => console.error("Error:", err));
        };

        function saringDanPaparkanEpisode(text) {
            let baris = text.split("\n");
            let listContainer = document.getElementById('boxSenaraiEpisode');
            listContainer.innerHTML = ""; 
            let ada = false;

            for(let i = 1; i < baris.length; i++) {
                if(baris[i].trim() === "") continue;
                let k = parseBarisCSVAman(baris[i]);
                if(k.length < 4) continue;

                if(k[0].replace(/^"|"$/g, '').trim().toLowerCase() === kartunID) {
                    ada = true;
                    let no = k[1].replace(/^"|"$/g, '').trim();
                    let judul = k[2].replace(/^"|"$/g, '').trim();
                    let link = k[3].replace(/^"|"$/g, '').trim();
                    let thumb = k[4] ? k[4].replace(/^"|"$/g, '').trim() : "";
                    let img = (thumb.startsWith('http')) ? thumb : "https://img.youtube.com/vi/" + link + "/0.jpg";
                    
                    let div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = function() { bukaVideo(link, `Episod ${no}: ${judul}`); };
                    div.innerHTML = `<img src="${img}" alt="Thumbnail"><div class="item-content"><p class="item-title">Episod ${no}: ${judul}</p><span class="episode-badge">Episod ${no}</span></div>`;
                    listContainer.appendChild(div);
                }
            }
            if(!ada) listContainer.innerHTML = "<p style='text-align:center;'>Belum ada episod.</p>";
        }

        function bukaVideo(link, tajuk) {
            document.getElementById('halaman-senarai').style.display = 'none';
            document.getElementById('halaman-nonton').style.display = 'block';
            document.getElementById('frame-video').src = link.includes('drive.google.com') ? link.replace('/view', '/preview') : "https://www.youtube.com/embed/" + link;
            document.getElementById('tajuk-video').innerText = tajuk;
        }

        function kembaliKeSenarai() {
            document.getElementById('halaman-senarai').style.display = 'block';
            document.getElementById('halaman-nonton').style.display = 'none';
        }

        function tukarTema() {
            document.body.classList.toggle('dark-mode');
            let isDark = document.body.classList.contains('dark-mode');
            document.getElementById('temaBtn-list').innerText = isDark ? "Mod Terang" : "Mod Gelap";
            document.getElementById('temaBtn-nonton').innerText = isDark ? "Mod Terang" : "Mod Gelap";
        }
    </script>
</body>
</html>
