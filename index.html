<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Nonton Kartun</title>
    <style>
        /* === SISTEM TEMA WARNA (DEFAULT: MOD TERANG) === */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-card: #fafafa;
            --border-card: #ddd;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-search: #ffffff;
        }

        /* Mod Gelap khas aplikasi streaming */
        .dark-mode {
            --bg-body: #0c111b; 
            --bg-container: #141a28;
            --bg-card: #1f273a;
            --border-card: #28334e;
            --text-main: #ffffff;
            --text-muted: #8f98b2;
            --bg-search: #1f273a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px; /* Dioptimalkan agar lebih rapat ke tepi layar gadget */
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px; /* Ukuran kontainer yang pas untuk menampung 3 kolom besar */
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-top: 5px solid #00e5ff; 
            position: relative;
            transition: background-color 0.3s;
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-card);
            padding-bottom: 15px;
        }

        h2 {
            text-align: left;
            color: #00e5ff; 
            margin: 0;
            font-size: clamp(16px, 4vw, 24px);
            text-transform: uppercase;
            letter-spacing: 1px;
            word-break: break-word;
            flex: 1;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            background: transparent;
        }

        .nav-item.active, .nav-item:hover {
            border-color: #00e5ff;
            color: #00e5ff;
            background: var(--bg-card);
        }

        .search-container {
            margin-bottom: 25px;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            border: 1px solid var(--border-card);
            border-radius: 8px;
            background-color: var(--bg-search);
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        /* PERUBAHAN: Dipastikan mengunci layout tetap 3 kolom ke samping dengan jarak gap yang ideal */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 18px 12px; 
        }

        .movie-item {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            cursor: pointer;
        }

        .id-card {
            width: 100%;
            padding-top: 100%; /* Rasio kotak sempurna 1:1, membesar mengikuti ruang 3 kolom */
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .id-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-item:hover .id-card {
            border-color: #00e5ff;
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.25);
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            margin: 8px 0 2px 0;
            line-height: 1.3;
            transition: color 0.2s;
        }

        .movie-item:hover .card-title {
            color: #00e5ff; 
        }

        .card-type {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-theme:hover {
            background: #00e5ff;
            color: #1e1e24;
        }

        @media (max-width: 768px) {
            .header-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .nav-menu {
                width: 100%;
                justify-content: flex-start;
            }
            /* Menjaga ukuran teks judul agar tidak meluap di HP */
            .card-title {
                font-size: 13px;
            }
            
            .banner-slider {
    width: 100%;
    overflow: hidden;
    margin-bottom: 20px;
    border-radius: 10px;
    height: 200px; /* Kalau ini tidak ada, banner jadi tidak kelihatan */
    background-color: transparent;
}

.banner-slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.banner-slider a {
    display: block;
    width: 100%;
    height: 100%;
}

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h2>Selamat Datang di Nonton Kartun</h2>
            <div class="nav-menu">
                <button class="nav-item active" onclick="tukarKategori('semua', this)">Semua</button>
                <button class="nav-item" onclick="tukarKategori('series', this)">Series</button>
                <button class="nav-item" onclick="tukarKategori('movie', this)">Movie</button>
                <button class="btn-theme" id="temaBtn" onclick="tukarTema()">Mod Gelap</button>
            </div>
        </div>

        <div class="banner-slider" id="sliderBanner"></div>

        <div class="search-container">
            <input type="text" id="cariKartun" class="search-box" placeholder="Cari nama kartun di sini..." onkeyup="jalankanPenyaringan()">
        </div>
        
        <div class="card-grid" id="gridKartun"></div>
    </div>

        <script>
    const URL_CSV_KARTUN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&single=true&output=csv";
    var kategoriSemasa = "semua";

    // 1. Jalankan saat halaman dimuat
    window.onload = function() {
        fetch(URL_CSV_KARTUN)
        .then(response => response.text())
        .then(data => parsedataCSV(data))
        .catch(err => console.error("Gagal memuat data: ", err));
    };

    // 2. Fungsi Utama untuk memproses data
        function parsedataCSV(text) {
        let baris = text.split("\n");
        let sliderBanner = document.getElementById('sliderBanner');
        let grid = document.getElementById('gridKartun');
        
        // Bersihkan area
        if(sliderBanner) sliderBanner.innerHTML = "";
        if(grid) grid.innerHTML = "";

        for(let i = 1; i < baris.length; i++) {
            if(baris[i].trim() === "") continue;
            let kolom = baris[i].split(",");
            
            // Kita ambil data dari kolom 0 sampai 4
            let data = {
                judul: kolom[0].trim(),
                tipe: kolom[1].trim().toLowerCase(),
                gambar: kolom[2].trim(),
                linkKartun: kolom[3].trim(),
                bannerUtama: kolom[4] ? kolom[4].trim() : "" // Mengambil kolom E (banner)
            };

            // Jika ada link banner di kolom E, masukkan ke slider
            if (sliderBanner && data.bannerUtama !== "") {
                sliderBanner.innerHTML += `
                    <a href="tonton.html?kartun=${data.linkKartun}">
                        <img src="${data.bannerUtama}" alt="${data.judul}" style="display:none;">
                    </a>`;
            }

            // Masukkan ke kartu grid
            if(grid) {
                grid.innerHTML += `
                <a href="tonton.html?kartun=${data.linkKartun}" class="movie-item" data-type="${data.tipe}">
                    <div class="id-card"><img src="${data.gambar}" alt="${data.judul}"></div>
                    <p class="card-title">${data.judul}</p>
                    <span class="card-type">${data.tipe}</span>
                </a>`;
            }
        }
        
        // Jalankan slide banner jika ada isinya
        if(sliderBanner && sliderBanner.children.length > 0) {
            tampilkanBanner(); 
        }
    }

    // 3. Fungsi Filter Kategori
    function tukarKategori(kategori, elemen) {
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        elemen.classList.add('active');
        kategoriSemasa = kategori;
        jalankanPenyaringan();
    }

    // 4. Fungsi Pencarian & Filter
    function jalankanPenyaringan() {
        let filter = document.getElementById('cariKartun').value.toLowerCase();
        let items = document.getElementsByClassName('movie-item');
        for (let item of items) {
            let title = item.querySelector('.card-title').textContent.toLowerCase();
            let type = item.getAttribute('data-type');
            let matchText = title.includes(filter);
            let matchCat = (kategoriSemasa === "semua" || type === kategoriSemasa);
            item.style.display = (matchText && matchCat) ? "" : "none";
        }
    }

    // 5. Fungsi Tema
    function tukarTema() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('temaBtn').innerText = document.body.classList.contains('dark-mode') ? "Mod Terang" : "Mod Gelap";
    }
    
</script>
