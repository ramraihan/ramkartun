<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Nonton Kartun</title>
    <style>
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff;
            --bg-card: #fafafa;
            --border-card: #ddd;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-search: #ffffff;
        }

        .dark-mode {
            --bg-body: #0c111b; 
            --bg-container: #141a28;
            --bg-card: #1f273a;
            --border-card: #28334e;
            --text-main: #ffffff;
            --text-muted: #8f98b2;
            --bg-search: #1f273a;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--bg-container); border-radius: 12px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); padding: 18px; border-top: 5px solid #00e5ff; }
        .header-box { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; border-bottom: 2px solid var(--border-card); padding-bottom: 15px; }
        h2 { color: #00e5ff; margin: 0; font-size: clamp(16px, 4vw, 24px); text-transform: uppercase; }
        .nav-menu { display: flex; align-items: center; gap: 12px; }
        .nav-item { cursor: pointer; padding: 6px 14px; border-radius: 20px; background: transparent; border: 1px solid transparent; }
        .nav-item.active { border-color: #00e5ff; color: #00e5ff; background: var(--bg-card); }
        .search-container { margin-bottom: 25px; }
        .search-box { width: 100%; padding: 12px 20px; border: 1px solid var(--border-card); border-radius: 8px; background-color: var(--bg-search); color: var(--text-main); }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; }
        .id-card { width: 100%; padding-top: 100%; position: relative; background: var(--bg-card); border-radius: 8px; overflow: hidden; }
        .id-card img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
        
        /* Banner Statis */
        .banner-slider { width: 100%; height: 200px; margin-bottom: 20px; border-radius: 10px; overflow: hidden; }
        .banner-slider img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h2>Selamat Datang di Nonton Kartun</h2>
            <div class="nav-menu">
                <button class="nav-item active" onclick="tukarKategori('semua', this)">Semua</button>
                <button class="nav-item" onclick="tukarKategori('series', this)">Series</button>
                <button class="nav-item" onclick="tukarKategori('movie', this)">Movie</button>
                <button class="btn-theme" id="temaBtn" onclick="tukarTema()">Mod Gelap</button>
            </div>
        </div>

        <div class="banner-slider" id="sliderBanner"></div>

        <div class="search-container">
            <input type="text" id="cariKartun" class="search-box" placeholder="Cari nama kartun di sini..." onkeyup="jalankanPenyaringan()">
        </div>
        
        <div class="card-grid" id="gridKartun"></div>
    </div>

    <script>
        const URL_CSV_KARTUN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIbfZERZ-9WhUrdYdNdJ2_8qNsyC0OHNnKt9NSn8m9GVuQhvgMovQOUPtSd_6Fetus0adAxUu6G4O/pub?gid=0&single=true&output=csv";
        var kategoriSemasa = "semua";

        window.onload = function() {
            fetch(URL_CSV_KARTUN)
            .then(response => response.text())
            .then(data => parsedataCSV(data))
            .catch(err => console.error("Gagal: ", err));
        };

        function parsedataCSV(text) {
            let baris = text.split("\n");
            let sliderBanner = document.getElementById('sliderBanner');
            let grid = document.getElementById('gridKartun');
            if(sliderBanner) sliderBanner.innerHTML = "";
            if(grid) grid.innerHTML = "";

            let bannerSudahDimuat = false;

            for(let i = 1; i < baris.length; i++) {
                if(baris[i].trim() === "") continue;
                let kolom = baris[i].split(",");
                let data = { judul: kolom[0].trim(), tipe: kolom[1].trim().toLowerCase(), gambar: kolom[2].trim(), linkKartun: kolom[3].trim(), bannerUtama: kolom[4] ? kolom[4].trim() : "" };

                if (!bannerSudahDimuat && data.bannerUtama !== "") {
                    sliderBanner.innerHTML = `<a href="tonton.html?kartun=${data.linkKartun}"><img src="${data.bannerUtama}" alt="Banner"></a>`;
                    bannerSudahDimuat = true;
                }

                if(grid) {
                    grid.innerHTML += `<a href="tonton.html?kartun=${data.linkKartun}" class="movie-item" data-type="${data.tipe}">
                        <div class="id-card"><img src="${data.gambar}" alt="${data.judul}"></div>
                        <p class="card-title">${data.judul}</p>
                        <span class="card-type">${data.tipe}</span>
                    </a>`;
                }
            }
        }

        function tukarKategori(kat, el) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            kategoriSemasa = kat;
            jalankanPenyaringan();
        }

        function jalankanPenyaringan() {
            let f = document.getElementById('cariKartun').value.toLowerCase();
            document.querySelectorAll('.movie-item').forEach(item => {
                let title = item.querySelector('.card-title').textContent.toLowerCase();
                let type = item.getAttribute('data-type');
                item.style.display = (title.includes(f) && (kategoriSemasa === "semua" || type === kategoriSemasa)) ? "" : "none";
            });
        }

        function tukarTema() {
            document.body.classList.toggle('dark-mode');
            document.getElementById('temaBtn').innerText = document.body.classList.contains('dark-mode') ? "Mod Terang" : "Mod Gelap";
        }
    </script>
</body>
</html>
